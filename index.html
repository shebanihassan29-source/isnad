<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إسناد — منصة العلم والمصدر | Isnad</title>
    <meta name="description" content="إسناد: محرك بحث أكاديمي حي في قواعد بيانات علمية مفتوحة مع سلة مراجع وتصدير التوثيق.">
    <meta name="theme-color" content="#1668a8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231668a8%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2742%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-family=%27Arial%27%3E%D8%A5%3C/text%3E%3C/svg%3E">
    <style>
        body {
            font-family: 'Calibri', Tahoma, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #bfe3fb 0%, #e6f5fd 420px, #e6f5fd 100%);
            background-attachment: fixed;
            color: #0b2540;
            margin: 0;
            padding: 16px
        }
        #srj {
            font-family: 'Calibri', Tahoma, 'Segoe UI', Arial, sans-serif;
            color: #0b2540;
            font-size: 15px
        }
        #srj button,
        #srj input,
        #srj select {
            font: inherit
        }
        #srj .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #7fb8e6;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            background: transparent;
            color: #0b2540;
            transition: background .15s ease-out
        }
        #srj .btn:hover {
            background: #dcf0ff
        }
        #srj .btn.solid {
            background: #1668a8;
            color: #ffffff;
            border-color: #1668a8;
            font-weight: 700
        }
        #srj .chip {
            border: 1.5px solid #7fb8e6;
            border-radius: 6px;
            padding: 5px 13px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #eaf6ff;
            color: #0b2540;
            transition: all .15s ease-out
        }
        #srj .chip.on {
            background: #1668a8;
            color: #ffffff;
            border-color: #1668a8
        }
        #srj .inp {
            border: 1px solid #7fb8e6;
            border-radius: 10px;
            padding: 10px 14px;
            background: #ffffff;
            color: #0b2540;
            outline: none;
            width: 100%;
            box-sizing: border-box
        }
        #srj .inp:focus {
            border-color: #0b2540
        }
        #srj select.inp {
            width: auto;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 8px
        }
        #srj .card {
            border: 1px solid #7fb8e6;
            border-radius: 10px;
            padding: 16px;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(11, 37, 64, .08)
        }
        #srj .res {
            border: 1px solid #7fb8e6;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            cursor: pointer;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(11, 37, 64, .08);
            transition: border-color .15s ease-out, box-shadow .15s ease-out
        }
        #srj .res:hover {
            border-color: #1668a8;
            box-shadow: 0 2px 8px rgba(11, 37, 64, .15)
        }
        #srj .meta {
            font-size: 13px;
            color: #1f3b52
        }
        #srj .badge {
            display: inline-block;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            background: #dcf0ff;
            color: #1f3b52;
            margin-inline-end: 6px
        }
        #srj .lbl {
            font-size: 12px;
            color: #35566f;
            margin-bottom: 4px;
            display: block
        }
        #srj .act {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #1f3b52;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            text-decoration: none
        }
        #srj .act:hover {
            background: #dcf0ff;
            color: #0b2540
        }
        #srj .grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            max-width: 1200px;
            margin: auto
        }
        #srj .switch {
            width: 36px;
            height: 20px;
            background: #dcf0ff;
            border: 1px solid #7fb8e6;
            border-radius: 999px;
            cursor: pointer;
            position: relative;
            transition: background .15s
        }
        #srj .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            inset-inline-start: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1f3b52;
            transition: all .15s ease-out
        }
        #srj .switch.on {
            background: #1668a8
        }
        #srj .switch.on::after {
            inset-inline-start: 18px;
            background: #ffffff
        }
        #srj textarea {
            background: #eaf6ff;
            border: 1px solid #7fb8e6;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.7;
            width: 100%;
            box-sizing: border-box;
            min-height: 160px;
            color: #0b2540
        }
        @media(max-width:820px) {
            #srj .grid {
                grid-template-columns: 1fr
            }
        }
        .res-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .res-actions>* {
            pointer-events: auto;
        }
        .res-actions button,
        .res-actions a {
            position: relative;
            z-index: 2;
        }
        #srj .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(11,37,64,.2);
            border-top-color: #1668a8;
            border-radius: 50%;
            animation: srj-spin .7s linear infinite;
            vertical-align: middle;
            margin-inline-end: 8px
        }
        @keyframes srj-spin {
            to { transform: rotate(360deg) }
        }
        #srj .btn[disabled] {
            opacity: .6;
            cursor: not-allowed
        }
    </style>
</head>

                    return ((data && data.items) || []).map(function(w) {
                        var vi = w.volumeInfo || {};
                        var title = vi.title || '(بلا عنوان)';
                        var year = 0; var m = /(\d{4})/.exec(vi.publishedDate || ''); if (m) year = +m[1];
                        var venue = vi.publisher || 'Google Books';
                        var abs = stripXml(vi.description || '');
                        var keys = vi.categories || [];
                        return {
                            title: { ar: title, en: title },
                            authors: { ar: authorsFromFullNames(vi.authors || []), en: authorsFromFullNames(vi.authors || []) },
                            year: year, venue: { ar: venue, en: venue },
                            srcs: ['gbooks'], url: vi.previewLink || vi.infoLink || w.selfLink, doi: null,
                            type: 'book', field: 'all', cites: 0,
                            oa: false,
                            abs: { ar: abs, en: abs }, keys: { ar: keys, en: keys }
                        };
                    });
                }).catch(function(e) { state.errSrcs.push('gbooks'); state.errWhy['gbooks'] = whyFail(e); return []; });
            }

            function searchInternetArchive() {
                var q = effectiveQuery();
                var url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q) + '+AND+mediatype:texts&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=year&fl[]=publisher&fl[]=description&rows=10&page=1&output=json';
                return fetchWithTimeout(url).then(function(r) { if (!r.ok) throw new Error('iarchive:' + r.status); return r.json(); }).then(function(data) {
                    var docs = (data && data.response && data.response.docs) || [];
                    return docs.map(function(w) {
                        var title = w.title || '(بلا عنوان)';
                        var creator = w.creator; var authors = Array.isArray(creator) ? creator : (creator ? [creator] : []);
                        var desc = w.description; var abs = stripXml(Array.isArray(desc) ? desc[0] : (desc || ''));
                        var year = 0; if (w.year) year = parseInt(w.year, 10) || 0;
                        return {
                            title: { ar: title, en: title },
                            authors: { ar: authorsFromFullNames(authors), en: authorsFromFullNames(authors) },
                            year: year, venue: { ar: w.publisher || 'Internet Archive', en: w.publisher || 'Internet Archive' },
                            srcs: ['iarchive'], url: 'https://archive.org/details/' + w.identifier, doi: null,
                            type: 'book', field: 'all', cites: 0,
                            oa: false,
                            abs: { ar: abs, en: abs }, keys: { ar: [], en: [] }
                        };
                    });
                }).catch(function(e) { state.errSrcs.push('iarchive'); state.errWhy['iarchive'] = whyFail(e); return []; });
            }

            function dedupe(items) {
                var out = [], seen = {};
                items.forEach(function(it) {
                    var keys = [];
                    if (it.doi) keys.push('doi:' + it.doi.toLowerCase());
                    var nt = normTitle(normArabic(it.title.en));
                    if (nt.length >= 20) keys.push('t:' + nt.slice(0, 90) + ':' + it.year);
                    else if (!it.doi) keys.push('t:' + nt + ':' + it.year);
                    var ex = null;
                    for (var i = 0; i < keys.length && !ex; i++) ex = seen[keys[i]] || null;
                    if (ex) {
                        it.srcs.forEach(function(s) { if (ex.srcs.indexOf(s) < 0) ex.srcs.push(s); });
                        if ((it.abs.en || '').length > (ex.abs.en || '').length) ex.abs = it.abs;
                        if ((it.cites || 0) > (ex.cites || 0)) ex.cites = it.cites;
                        if ((!ex.keys.en || !ex.keys.en.length) && it.keys.en && it.keys.en.length) ex.keys = it.keys;
                        if (!ex.doi && it.doi) { ex.doi = it.doi; ex.url = it.url; }
                        if (it.oa && !ex.oa) ex.oa = true;
                        keys.forEach(function(k) { if (!seen[k]) seen[k] = ex; });
                    } else {
                        keys.forEach(function(k) { seen[k] = it; });
                        out.push(it);
                    }
                });
                return out;
            }

            function activeSrcs() {
                if (state.srcs.has('all')) return Object.keys(SRCS).filter(function(k) { return k !== 'all'; });
                return Array.from(state.srcs);
            }

            function runSearch() {
                var q = state.q.trim();
                state.expanded = null; state.aiId = null; state.errSrcs = []; state.errWhy = {}; state.page = 1; state.filterType = null; state.filterSrc = null;
                if (!q) { state.results = []; state.searched = false; render(); return; }
                state.loading = true; state.searched = true; render();
                var my = ++reqToken;
                var srcs = activeSrcs();
                var jobs = [];
                if (srcs.indexOf('openalex') >= 0) jobs.push(searchOpenAlex());
                if (srcs.indexOf('crossref') >= 0) jobs.push(searchCrossref());
                if (srcs.indexOf('semantic') >= 0) jobs.push(searchSemantic());
                if (srcs.indexOf('pubmed') >= 0 && !(/[\u0600-\u06FF]/.test(q) && !/[A-Za-z]/.test(q))) jobs.push(searchPubmed());
                if (srcs.indexOf('doaj') >= 0) jobs.push(searchDOAJ());
                if (srcs.indexOf('gbooks') >= 0) jobs.push(searchGoogleBooks());
                if (srcs.indexOf('iarchive') >= 0) jobs.push(searchInternetArchive());
                var heritageResults = (srcs.indexOf('heritage') >= 0) ? searchHeritage(q) : [];
                Promise.all(jobs).then(function(lists) {
                    if (my !== reqToken) return;
                    var inter = [], mx = Math.max.apply(null, lists.map(function(l) { return l.length; }).concat([0]));
                    for (var ii = 0; ii < mx; ii++) lists.forEach(function(l) { if (l[ii]) inter.push(l[ii]); });
                    var merged = dedupe(inter.concat(heritageResults));
                    if (state.yfrom) merged = merged.filter(function(it) { return !it.year || it.year >= state.yfrom; });
                    if (state.yto) merged = merged.filter(function(it) { return !it.year || it.year <= state.yto; });
                    merged.forEach(function(it) { it.id = 'r' + (++uidSeq); it.url = safeUrl(it.url); });
                    if (state.sort === 'rel') {
                        var rt = normArabic(q).split(/[^\p{L}\p{N}]+/u).filter(function(x) { return x.length >= 3 && STOP.indexOf(x) < 0; });
                        if (rt.length) {
                            merged.forEach(function(it, i) {
                                var ti = normArabic(it.title.ar + ' ' + it.title.en), ot = normArabic((it.abs.en || '') + ' ' + (it.abs.ar || '') + ' ' + (it.venue.en || '') + ' ' + (it.keys.en || []).join(' '));
                                var sc = 0; rt.forEach(function(tk) { if (ti.indexOf(tk) >= 0) sc += 2; else if (ot.indexOf(tk) >= 0) sc += 1; });
                                it._s = sc / (2 * rt.length) + Math.log10(1 + (it.cites || 0)) * 0.03; it._i = i;
                            });
                            merged.sort(function(a, b) { return (b._s - a._s) || (a._i - b._i); });
                        }
                    }
                    if (state.sort === 'yd') merged.sort(function(a, b) { return b.year - a.year; });
                    else if (state.sort === 'ya') merged.sort(function(a, b) { return a.year - b.year; });
                    else if (state.sort === 'c') merged.sort(function(a, b) { return (b.cites || 0) - (a.cites || 0); });
                    state.results = merged;
                    state.allKnown = state.allKnown || {};
                    merged.forEach(function(it) { state.allKnown[it.id] = it; });
                    state.loading = false;
                    render();
                });
            }

            var app = document.getElementById('app');

            function yearOpts(sel) {
                var o = '<option value="0"' + (sel === 0 ? ' selected' : '') + '>' + t('all') + '</option>';
                for (var y = new Date().getFullYear(); y >= 1500; y--) { o += '<option value="' + y + '"' + (y === sel ? ' selected' : '') + '>' + (state.lang === 'ar' ? y + 'م' : y) + '</option>'; }
                return o;
            }

            // ============ عناصر مستوحاة من واجهة OpenAlex: توزيع السنوات، فلاتر جانبية حية، ترقيم صفحات ============
            function yearHistogram() {
                var withYear = state.results.filter(function(it) { return it.year && it.year >= 1900; });
                if (withYear.length < 4) return '';
                var minY = Math.min.apply(null, withYear.map(function(it) { return it.year; }));
                var maxY = Math.max.apply(null, withYear.map(function(it) { return it.year; }));
                if (minY === maxY) return '';
                var buckets = 16;
                var span = Math.max(1, maxY - minY);
                var counts = new Array(buckets).fill(0);
                withYear.forEach(function(it) {
                    var idx = Math.min(buckets - 1, Math.floor(((it.year - minY) / span) * buckets));
                    counts[idx]++;
                });
                var maxC = Math.max.apply(null, counts);
                var bars = counts.map(function(c) {
                    var h = maxC ? Math.max(3, Math.round((c / maxC) * 32)) : 3;
                    return '<div title="' + c + '" style="flex:1;height:' + h + 'px;background:#7fb8e6;border-radius:2px 2px 0 0"></div>';
                }).join('');
                return '<div style="margin-bottom:8px"><div style="display:flex;align-items:flex-end;gap:2px;height:32px">' + bars + '</div>' +
                    '<div style="display:flex;justify-content:space-between;font-size:11px;color:#35566f;margin-top:2px"><span>' + minY + '</span><span>' + maxY + '</span></div></div>';
            }
            function baseForType() { return state.filterSrc ? state.results.filter(function(it) { return it.srcs.indexOf(state.filterSrc) >= 0; }) : state.results; }
            function baseForSrc() { return state.filterType ? state.results.filter(function(it) { return it.type === state.filterType; }) : state.results; }
            function typeCounts() {
                var c = {}; baseForType().forEach(function(it) { c[it.type] = (c[it.type] || 0) + 1; }); return c;
            }
            function srcCounts() {
                var c = {}; baseForSrc().forEach(function(it) { it.srcs.forEach(function(s) { c[s] = (c[s] || 0) + 1; }); }); return c;
            }
            function visibleResults() {
                return state.results.filter(function(it) {
                    if (state.filterType && it.type !== state.filterType) return false;
                    if (state.filterSrc && it.srcs.indexOf(state.filterSrc) < 0) return false;
                    return true;
                });
            }
            function pagedResults() {
                var vis = visibleResults();
                var start = (state.page - 1) * PAGE_SIZE;
                return { items: vis.slice(start, start + PAGE_SIZE), total: vis.length, pages: Math.max(1, Math.ceil(vis.length / PAGE_SIZE)) };
            }

                h += '<div><span class="lbl">' + t('sort') + '</span><select class="inp" id="srt">' + ['rel', 'yd', 'ya', 'c'].map(function(k) { return '<option value="' + k + '"' + (state.sort === k ? ' selected' : '') + '>' + t('s' + k.charAt(0).toUpperCase() + k.slice(1)) + '</option>'; }).join('') + '</select></div>';
                h += '</div></div>';

                // روابط البحث الخارجية المباشرة
                if (state.q.trim()) {
                    h += '<div class="card" style="margin-bottom:16px">';
                    h += '<div style="font-size:13px;font-weight:700;margin-bottom:2px">' + t('extTitle') + '</div>';

                    }).join('') + '</div></div>';
                }

                h += '<div class="grid"><div>';
                var nSrc = {}; state.results.forEach(function(it) { it.srcs.forEach(function(s) { nSrc[s] = 1; }); });
                h += '<div style="font-size:15px;font-weight:700;margin-bottom:12px">' + t('results');
                if (state.searched && !state.loading) h += ' <span style="color:#35566f;font-weight:400;font-size:13px">— ' + state.results.length + (function() { var ln = Object.keys(nSrc).filter(function(k) { return k !== 'heritage'; }).length; return ln ? ' ' + t('found1') + ' ' + ln + ' ' + t('found2') : ''; })() + '</span>';
                h += '</div>';
                if (state.errSrcs.length) h += '<div style="font-size:12px;color:#a55;margin-bottom:10px">' + t('partialErr') + state.errSrcs.map(function(s) { return (SRCS[s] ? SRCS[s][L] : s) + (state.errWhy[s] ? ' [' + state.errWhy[s] + ']' : ''); }).join('، ') + '</div>';

                // فلاتر جانبية حية (نوع العمل ومصدره) محسوبة من النتائج الحالية بلا أي طلب شبكي جديد
                if (state.searched && !state.loading && state.results.length) {

                var pg = pagedResults();

                        h += '<div style="font-size:12px;color:#35566f;margin-bottom:4px">' + t('aiSum') + '</div>';
                        h += '<div style="font-size:13px;line-height:1.7;margin-bottom:10px">' + esc(it.abs[L] || t('noAbs')) + '</div>';
                        if (it.keys[L] && it.keys[L].length) {
                            h += '<div style="font-size:12px;color:#35566f;margin-bottom:4px">' + t('aiKeys') + '</div>';
                            h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' + it.keys[L].map(function(k) { return '<span class="badge">' + esc(k) + '</span>'; }).join('') + '</div>';
                        }
                        if (it.srcs.length > 1) h += '<div style="font-size:12px;color:#35566f">' + t('alsoIn') + ': ' + it.srcs.map(function(s) { return SRCS[s][L]; }).join('، ') + '</div>';

                });

                else {
                    state.basket.forEach(function(id) {
                        var it = state.allKnown && state.allKnown[id];
                        if (!it) return;
                        h += '<div style="display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #7fb8e6;font-size:13px"><div style="flex:1"><div style="line-height:1.4">' + esc(itemTitle(it)) + '</div><div style="color:#35566f;font-size:12px;margin-top:2px">' + (it.year || '') + ' · ' + SRCS[it.srcs[0]][L] + '</div></div><button class="act" data-rm="' + id + '" style="padding:4px">✕ ' + t('rm') + '</button></div>';

                h += '</div>';
                h += '<div class="card"><div style="font-weight:700;margin-bottom:10px">' + t('exp') + '</div>';
                h += '<span class="lbl">' + t('style') + '</span><select class="inp" id="sty" style="width:100%;margin-bottom:10px">' + Object.keys(t('styles')).map(function(k) { return '<option value="' + k + '"' + (state.style === k ? ' selected' : '') + '>' + t('styles')[k] + '</option>'; }).join('') + '</select>';
                h += '<span class="lbl">' + t('format') + '</span><select class="inp" id="fmt" style="width:100%;margin-bottom:10px">' + Object.keys(t('formats')).map(function(k) { return '<option value="' + k + '"' + (state.format === k ? ' selected' : '') + '>' + t('formats')[k] + '</option>'; }).join('') + '</select>';
                h += '<span class="lbl">' + t('preview') + '</span><textarea readonly id="pv">' + esc(state.basket.length ? citationsText(state.style) : '') + '</textarea>';
                h += '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn solid" id="expBtn" style="flex:1;justify-content:center">' + SVG.dl + ' ' + t('exp') + '</button><button class="btn" id="cpBtn">' + SVG.copy + ' ' + t('cp') + '</button></div>';
                h += '</div></div></div></div>';
                h += '<div style="max-width:1200px;margin:24px auto 4px;text-align:center;font-size:12px;font-weight:600;color:#0b2540">© د. حسن الشيباني — جامعة الزاوية</div>';
                app.innerHTML = h;
                app.setAttribute('dir', L === 'ar' ? 'rtl' : 'ltr');
                document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
                document.title = t('brand') + ' — ' + t('tag');
                bind();
            }

            function bind() {
                var langBtn = document.getElementById('langBtn');
                if (langBtn) langBtn.onclick = function() { state.lang = state.lang === 'ar' ? 'en' : 'ar'; render(); };
                var q = document.getElementById('q');
                var goBtn = document.getElementById('goBtn');
                var gsBtn = document.getElementById('gsBtn');
                if (gsBtn) gsBtn.onclick = function() { var qq = (document.getElementById('q') || {}).value || state.q; qq = (qq || '').trim(); if (!qq) return; window.open(scholarUrl(qq), '_blank', 'noopener'); };
                function doSearch(e) { if (e) e.preventDefault(); if (state.loading) return; if (q) state.q = q.value.trim(); runSearch(); }
                if (goBtn) goBtn.onclick = doSearch;
                if (q) q.oninput = function() { state.q = q.value; };
                if (q) q.onkeydown = function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } };

                var aiSw = document.getElementById('aiSw');
                if (aiSw) { aiSw.onclick = function() { state.ai = !state.ai; state.aiId = null; render(); }; aiSw.onkeydown = function(e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); aiSw.onclick(); } }; }
                var aiQBtn = document.getElementById('aiQBtn');
                if (aiQBtn) aiQBtn.onclick = function() {
                    var arr = SAMPLE_TOPICS[state.lang];
                    state.q = arr[Math.floor(Math.random() * arr.length)];
                    if (!state.loading) runSearch(); else render();
                };
                var yf = document.getElementById('yf'); if (yf) yf.onchange = function() { state.yfrom = +this.value; if (state.searched) runSearch(); else render(); };
                var yt = document.getElementById('yt'); if (yt) yt.onchange = function() { state.yto = +this.value; if (state.searched) runSearch(); else render(); };
                var fld = document.getElementById('fld'); if (fld) fld.onchange = function() { state.field = this.value; if (state.searched) runSearch(); else render(); };
                var srt = document.getElementById('srt'); if (srt) srt.onchange = function() { state.sort = this.value; if (state.searched) runSearch(); else render(); };

                app.querySelectorAll('[data-src]').forEach(function(el) {
                    el.onclick = function() {
                        var k = this.getAttribute('data-src');
                        if (k === 'all') { state.srcs = new Set(['all']); }
                        else {
                            state.srcs.delete('all');
                            if (state.srcs.has(k)) state.srcs.delete(k); else state.srcs.add(k);
                            if (!state.srcs.size) state.srcs.add('all');
                        }
                        if (state.searched) runSearch(); else render();
                    };
                });
                app.querySelectorAll('[data-ftype]').forEach(function(el) {
                    el.onclick = function() { state.filterType = this.getAttribute('data-ftype') || null; state.page = 1; render(); };
                });
                app.querySelectorAll('[data-fsrc]').forEach(function(el) {
                    el.onclick = function() { state.filterSrc = this.getAttribute('data-fsrc') || null; state.page = 1; render(); };
                });
                app.querySelectorAll('[data-page]').forEach(function(el) {
                    el.onclick = function() { state.page = +this.getAttribute('data-page'); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                });
                app.querySelectorAll('.res').forEach(function(el) {
                    el.onclick = function(e) { if (e.target.closest('[data-stop]')) return; var id = this.getAttribute('data-id'); state.expanded = state.expanded === id ? null : id; render(); };
                });
                app.querySelectorAll('[data-stop]').forEach(function(el) { el.addEventListener('click', function(e) { e.stopPropagation(); }); });
                app.querySelectorAll('[data-save]').forEach(function(el) {
                    el.onclick = function(e) { e.stopPropagation(); var id = this.getAttribute('data-save'); var i = state.basket.indexOf(id); if (i >= 0) state.basket.splice(i, 1); else state.basket.push(id); render(); };
                });
                app.querySelectorAll('[data-ai]').forEach(function(el) {
                    el.onclick = function(e) { e.stopPropagation(); var id = this.getAttribute('data-ai'); state.aiId = state.aiId === id ? null : id; state.expanded = id; render(); };
                });
                app.querySelectorAll('[data-rm]').forEach(function(el) {
                    el.onclick = function(e) { e.stopPropagation(); var id = this.getAttribute('data-rm'); var i = state.basket.indexOf(id); if (i >= 0) state.basket.splice(i, 1); render(); };
                });
                var clrBtn = document.getElementById('clrBtn'); if (clrBtn) clrBtn.onclick = function() { state.basket = []; render(); };
                var sty = document.getElementById('sty'); if (sty) sty.onchange = function() { state.style = this.value; render(); };
                var fmt2 = document.getElementById('fmt'); if (fmt2) fmt2.onchange = function() { state.format = this.value; };
                var cpBtn = document.getElementById('cpBtn');
                if (cpBtn) cpBtn.onclick = function() {
                    var ta = document.getElementById('pv'); if (!ta || !ta.value) return; ta.select();
                    try { document.execCommand('copy'); } catch (e) {}
                    if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
                };
                var expBtn = document.getElementById('expBtn'); if (expBtn) expBtn.onclick = exportFile;
            }

            function exportFile() {
                if (!state.basket.length) return;
                var L = state.lang, txt = citationsText(state.style);
                if (state.format === 'pdf') {
                    var pa = document.getElementById('printArea');
                    pa.innerHTML = '<div dir="' + (L === 'ar' ? 'rtl' : 'ltr') + '" style=\"font-family:Calibri, Tahoma, &quot;Segoe UI&quot;, Arial, sans-serif;padding:32px;max-width:720px;margin:auto;color:#111">' +
                        '<h1 style="font-size:20px">' + t('printT') + '</h1>' +
                        '<p style="font-size:12px;color:#888">' + t('printNote') + ' ' + t('styles')[state.style] + ' · ' + new Date().toLocaleDateString(L === 'ar' ? 'ar' : 'en') + '</p><hr>' +
                        txt.split('\n\n').map(function(c) { return '<p style="line-height:1.8;font-size:14px;margin:12px 0">' + esc(c).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>';
                    app.style.display = 'none'; pa.style.display = 'block';
                    var done = function() { window.onafterprint = null; pa.style.display = 'none'; pa.innerHTML = ''; app.style.display = 'block'; };
                    window.onafterprint = done;
                    setTimeout(function() { window.print(); setTimeout(done, 2000); }, 80);
                    return;
                }
                var mime = 'text/plain', ext = 'txt', body = txt;
                if (state.format === 'word') {
                    mime = 'application/msword'; ext = 'doc';
                    body = '<html dir="' + (L === 'ar' ? 'rtl' : 'ltr') + '"><head><meta charset="utf-8"></head><body style="font-family:Calibri, Tahoma, &quot;Segoe UI&quot;, Arial, sans-serif"><h3>' + t('printT') + '</h3>' + txt.split('\n\n').map(function(c) { return '<p>' + esc(c).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</body></html>';
                }
                if (state.format === 'bib') { body = state.basket.map(function(id) { var it = state.allKnown[id]; return it ? bibtex(it) : ''; }).filter(Boolean).join('\n\n'); }
                if (state.format === 'ris') { mime = 'application/x-research-info-systems'; ext = 'ris'; body = state.basket.map(function(id) { var it = state.allKnown[id]; return it ? ris(it) : ''; }).filter(Boolean).join('\n\n'); }
                var a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([body], { type: mime + ';charset=utf-8' }));
                a.download = 'isnad-references.' + ext;
                document.body.appendChild(a); a.click();
                setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 400);
            }
            state.allKnown = {};
            render();
        })();
    </script>
</body>
</html>
